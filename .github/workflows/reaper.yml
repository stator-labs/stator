name: Reaper

# Nightly dry run: lists resources tagged runway:ephemeral=true and deletes nothing.
# stator-ci-reaper trusts only this file on main (the schedule and manual runs). The AWS
# trust policy refuses pull requests and other branches, and the job also stops early on them.
# GitHub pauses schedules in a public repo after 60 days without activity; the weekly
# board-health task checks that this workflow still ran.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reaper
  cancel-in-progress: false

jobs:
  find:
    name: "Reaper: find ephemeral resources"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC -> stator-ci-reaper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Role from the account ID
        id: target
        env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: tools/ci-target.sh labs reaper
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.target.outputs.role_arn }}
          aws-region: ${{ steps.target.outputs.region }}
          role-session-name: stator-reaper-${{ github.run_id }}
          retry-max-attempts: 3 # a wrong trust policy will not fix itself; fail in seconds
          mask-aws-account-id: true # default is false; the repo is public
      - name: Show OIDC claims (the role's trust policy must match them)
        if: failure() && steps.aws.outcome == 'failure'
        run: python3 tools/oidc-claims.py
      - name: Find resources tagged runway:ephemeral=true
        run: |
          aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=runway:ephemeral,Values=true \
            | python3 tools/reaper.py >> "$GITHUB_STEP_SUMMARY"
