name: Tofu Plan

# Reusable plan workflow. AWS trusts it by job_workflow_ref on main, so this file is the
# only code path to the plan roles. Called by infrastructure.yml in two modes:
#   pr:   stator-plan (pull requests). Posts or updates the PR plan comment.
#   main: stator-plan-main (pushes to main). Saves each plan file under plans/ in the
#         state bucket and returns its key and SHA-256, so the apply job applies exactly
#         the plan you approved (STAT-34).
# The checkout under src/ is the code being planned and is not trusted. Every script this
# workflow runs comes from main's checkout under trusted/.
on:
  workflow_call:
    inputs:
      stacks:
        description: JSON array of changed stack paths
        required: true
        type: string
      head_sha:
        description: Commit being planned (PR head or main)
        required: true
        type: string
      pr_number:
        description: Pull request number (pr mode only)
        required: false
        type: number
        default: 0
      mode:
        description: "pr or main"
        required: false
        type: string
        default: pr
    secrets:
      # Unused. Kept declared until every open branch stops passing it, because passing an
      # undeclared secret fails the call. Delete after PR 36 merges.
      ALERT_EMAIL:
        required: false
    outputs:
      plans:
        description: 'main mode: JSON object {stack: {"key": S3 key, "sha256": hex}} for stacks with changes'
        value: ${{ jobs.plan.outputs.plans }}

permissions:
  contents: read

jobs:
  plan:
    name: "Tofu Plan: run"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC -> stator-plan (pr) or stator-plan-main (main)
      pull-requests: write # the plan comment (pr mode)
    outputs:
      plans: ${{ steps.plan.outputs.plans }}
    steps:
      - name: Check mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in pr|main) ;; *) echo "::error::mode must be pr or main, got '$MODE'"; exit 1 ;; esac
      - name: Check out the code to plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: Check out main for the scripts this workflow runs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          path: trusted
          sparse-checkout: tools
      - name: Install pinned tofu
        run: sudo trusted/tools/cloud-setup.sh tofu
      - name: Provider allowlist (before any provider code runs)
        env:
          STACKS: ${{ inputs.stacks }}
        working-directory: src
        run: |
          # shellcheck disable=SC2046
          python3 ../trusted/tools/provider-allowlist.py $(jq -r '.[]' <<<"$STACKS")
      - name: Show OIDC claims (verifies job_workflow_ref and sub)
        run: python3 trusted/tools/oidc-claims.py
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.mode == 'main' && vars.AWS_PLAN_MAIN_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: stator-plan-${{ inputs.mode }}-${{ github.run_id }}
          retry-max-attempts: 3 # a wrong trust policy will not fix itself; fail in seconds
          mask-aws-account-id: true # default is false; the repo is public
      - name: tofu plan and plan-gate
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          STACKS: ${{ inputs.stacks }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          COMMENT: ${{ runner.temp }}/plan-comment.md
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          set -uo pipefail
          n=$(jq length <<<"$STACKS")
          limit=$(( 60000 / n ))
          failed=0
          plans='{}'
          if [ "$MODE" = pr ]; then
            next="Applies after merge, in environment \`aws-apply\`."
          else
            next="Saved for the apply job. Approve \`aws-apply\` to apply exactly these plans."
          fi
          # The backticks are Markdown code spans, not shell expansion.
          # shellcheck disable=SC2016
          printf '## Infrastructure plan\n\nCommit `%s`. %s\n' "$HEAD_SHA" "$next" >"$COMMENT"
          for dir in $(jq -r '.[]' <<<"$STACKS"); do
            out="$RUNNER_TEMP/plan.txt"
            plan_bin="$RUNNER_TEMP/tfplan"
            plan_json="$RUNNER_TEMP/plan.json"
            rm -f "$plan_bin" "$plan_json"
            {
              tofu -chdir="src/$dir" init -no-color -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" \
                && tofu -chdir="src/$dir" plan -no-color -lock-timeout=5m -detailed-exitcode -out="$plan_bin"
            } >"$out" 2>&1
            rc=$?
            gate_line=""
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
              summary=$(grep -E '^(Plan:|No changes\.)' "$out" | tail -1)
              if tofu -chdir="src/$dir" show -json "$plan_bin" >"$plan_json" 2>>"$out"; then
                gate_out=$(python3 trusted/tools/plan-gate.py "$dir" "$plan_json" 2>&1)
                gate_rc=$?
                printf '%s\n' "$gate_out" >>"$out"
                gate_line=$(head -1 <<<"$gate_out")
                if [ "$gate_rc" -ne 0 ]; then
                  failed=1
                  summary="❌ blocked by plan-gate ($gate_line)"
                elif [ "$MODE" = main ] && [ "$rc" -eq 2 ]; then
                  key="plans/$RUN_KEY/${dir//\//__}.tfplan"
                  sha=$(sha256sum "$plan_bin" | cut -d' ' -f1)
                  if aws s3 cp --only-show-errors "$plan_bin" "s3://$TF_STATE_BUCKET/$key" 2>>"$out"; then
                    plans=$(jq -c --arg d "$dir" --arg k "$key" --arg s "$sha" '.[$d] = {key: $k, sha256: $s}' <<<"$plans")
                    summary="$summary (saved, sha256 \`${sha:0:12}\`)"
                  else
                    failed=1
                    summary="❌ failed to save the plan file"
                  fi
                fi
              else
                failed=1
                summary="❌ failed to export plan JSON"
              fi
            else
              failed=1
              summary="❌ failed (exit $rc)"
            fi
            # Plan text is data: stop it from being read as workflow commands.
            token=$(openssl rand -hex 16)
            echo "::stop-commands::$token"; cat "$out"; echo "::$token::"
            {
              # shellcheck disable=SC2016
              printf '\n### `%s`\n%s\n' "$dir" "$summary"
              if [ -n "$gate_line" ]; then
                # shellcheck disable=SC2016
                printf '`%s`\n' "$gate_line"
              fi
              printf '\n<details><summary>Show output</summary>\n\n```\n'
              tail -c "$limit" "$out"
              printf '\n```\n</details>\n'
            } >>"$COMMENT"
          done
          if [ -n "$AWS_ACCOUNT_ID" ]; then
            body=$(cat "$COMMENT")
            printf '%s\n' "${body//"$AWS_ACCOUNT_ID"/(redacted)}" >"$COMMENT"
          fi
          # main mode: the approver reads the plan here, in the run summary, before approving.
          [ "$MODE" = main ] && cat "$COMMENT" >>"$GITHUB_STEP_SUMMARY"
          echo "plans=$plans" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Post or update the plan comment
        if: ${{ !cancelled() && steps.plan.outcome != 'skipped' && inputs.mode == 'pr' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT: ${{ runner.temp }}/plan-comment.md
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- runway-infrastructure-plan -->';
            const body = `${marker}\n${fs.readFileSync(process.env.COMMENT, 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user?.type === 'Bot' && c.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if a plan failed
        if: steps.plan.outputs.failed == '1'
        run: exit 1
