name: Policy

# Decides whether a PR may merge without Yaaf's click.
# GitHub blocks pull_request_target in public repos from 2026-12-02 unless an Actions event
# policy allows it. .github/actions-policies/policy-check.json allows it for this file only.
# It runs main's copy of this file (pull_request_target), so a PR cannot change the rule that
# judges it. It never checks out or runs PR code: it reads the changed file names from the API.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no PR checkout, read-only token, file names only
    branches: [main]
    # auto_merge_* re-runs the check when auto-merge is switched on or off.
    types: [opened, synchronize, reopened, auto_merge_enabled, auto_merge_disabled]
  # The check is required, so it must also report in a merge queue.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  trust-paths:
    name: "Policy: trust paths"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Queue passes
        if: github.event_name == 'merge_group'
        run: echo "The PR passed this check before it was queued."
      - name: Auto-merge only for allow-listed files
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          set -euo pipefail
          # Default deny: a PR may auto-merge only if every file it adds, changes, removes or
          # renames (old and new name) is on this allow-list. Everything else needs Yaaf's merge.
          # The four docs below are read by agents as rules or as data, so they stay human-merged.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          blocked=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/how-this-works.md|docs/human-in-the-loop.md|docs/index.md|docs/radar.md) blocked+="$f"$'\n' ;;
              docs/*|labs/*/README.md|templates/*|README.md) ;;
              *) blocked+="$f"$'\n' ;;
            esac
          done <<<"$files"
          if [ -z "$blocked" ]; then
            echo "Only allow-listed files changed: auto-merge allowed."
            exit 0
          fi
          # File names come from the PR author: stop them from being read as workflow commands.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf 'Files outside the auto-merge allow-list:\n%s' "$blocked"
          echo "::$token::"
          if [ "$AUTO_MERGE" = true ]; then
            echo "::error::Auto-merge is on, but this PR changes files outside the allow-list. Turn auto-merge off; Yaaf merges it."
            exit 1
          fi
          echo "Auto-merge is off: Yaaf merges."
