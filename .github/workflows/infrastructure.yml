name: Infrastructure

# Pipeline v2 (IaC platform v2, task 8). Roles come from AWS_LABS_ACCOUNT_ID (tools/ci-target.sh).
# PR:   fmt, validate, tflint, checkov, then plan.yml (pr mode) per changed stack, posted as one
#       PR comment. PR plans run without the state lock.
# main: plan.yml (main mode) plans every CI stack and saves each plan with its SHA-256.
#       apply.yml then applies exactly those files: lane auto in aws-apply-auto right away,
#       lane manual in aws-apply after you approve. The rolling "Infrastructure: apply waiting"
#       issue links the one run to approve. Supersede cancels older waiting runs.
#       The report job keeps "Infrastructure: main is failing" open until a run passes.
# Terminal-only stacks (platform/stacks.json, ci: false) are never planned or applied here.

on:
  pull_request:
    branches: [main]
    # No paths filter: "Infrastructure: required checks" is a required check and must report
    # on every PR. `detect-stacks` decides what to plan.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    # No paths filter either: main plans every stack, so a tool or tofu bump replans too.

permissions:
  contents: read

# PRs: a new push cancels the old plan. main: one run at a time with GitHub's default queue,
# which keeps only the newest pending run. That is safe because each main run plans every stack.
concurrency:
  group: infrastructure-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  detect-stacks:
    name: "Infrastructure: detect stacks"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: stacks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = push ]; then
            # main plans every CI stack: a cancelled run can never drop one, and a no-change
            # plan doubles as a drift check.
            stacks=$(python3 tools/tofu-stacks.py ci)
          else
            stacks=$(python3 tools/tofu-stacks.py changed "$BASE" "$HEAD")
          fi
          echo "stacks: $stacks"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  validate:
    name: "Infrastructure: validate"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tofu, tflint, checkov (SHA256-checked)
        run: sudo tools/cloud-setup.sh tofu tflint checkov
      - name: Stack layout (backend key per stack)
        run: python3 tools/tofu-stacks.py check
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
      - name: tofu validate
        run: |
          for dir in $(python3 tools/tofu-stacks.py all | jq -r '.[]'); do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -lockfile=readonly
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Script self-tests
        run: |
          python3 tools/plan-gate.py --self-test
          python3 tools/provider-allowlist.py --self-test
          python3 .agents/hooks/guardrails.py --self-test
      - name: tofu test (mocked providers, no AWS access)
        # Runs every stack and module that has a tests/ folder. No credentials: providers are mocked.
        run: |
          for dir in $(python3 tools/tofu-stacks.py all | jq -r '.[]'); do
            [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -lockfile=readonly
            tofu -chdir="$dir" test
            echo "::endgroup::"
          done
          # Modules carry no lockfile (the calling stack pins providers), so init them unlocked.
          for dir in platform/infra/modules/*/; do
            [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false
            tofu -chdir="$dir" test
            echo "::endgroup::"
          done
      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
      - name: checkov (includes CKV_RUNWAY_1, required default_tags)
        run: checkov -d . --framework terraform --external-checks-dir tools/checkov --compact --quiet

  plan:
    name: "Infrastructure: plan"
    needs: [detect-stacks, validate]
    # Fork PRs get no OIDC token; the trust policy would refuse them anyway.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect-stacks.outputs.stacks != '[]'
    permissions:
      contents: read
      id-token: write # OIDC -> stator-ci-plan-pr
      pull-requests: write # the plan comment
    uses: stator-labs/stator/.github/workflows/plan.yml@main # zizmor: ignore[unpinned-uses] AWS OIDC job_workflow_ref requires @refs/heads/main
    # No secrets: PR plans run the PR's own code, which can read anything passed in.
    with:
      mode: pr
      stacks: ${{ needs.detect-stacks.outputs.stacks }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}
    # No secrets: PR plans run the PR's own code, which can read anything passed in.

  required-checks:
    name: "Infrastructure: required checks"
    # Required check for auto-merge. Always runs on PRs, even when check or plan are skipped,
    # because a skipped required check would block the PR forever.
    if: always() && github.event_name != 'push'
    needs: [detect-stacks, validate, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check results
        env:
          DETECT: ${{ needs.detect-stacks.result }}
          CHECK: ${{ needs.validate.result }}
          PLAN: ${{ needs.plan.result }}
          EVENT: ${{ github.event_name }}
          STACKS: ${{ needs.detect-stacks.outputs.stacks }}
        run: |
          echo "detect=$DETECT check=$CHECK plan=$PLAN stacks=$STACKS"
          [ "$DETECT" = success ] || { echo "::error::detect did not succeed ($DETECT)"; exit 1; }
          [ "$CHECK" = success ] || { echo "::error::Infrastructure: validate did not succeed ($CHECK)"; exit 1; }
          if [ "$STACKS" = '[]' ] || [ "$EVENT" = merge_group ]; then
            # No stack changed, or the merge queue: the PR's own plan already ran, and the plan role
            # trusts pull requests only. Plan is skipped on purpose.
            [ "$PLAN" = success ] || [ "$PLAN" = skipped ] || { echo "::error::Infrastructure: plan result: $PLAN"; exit 1; }
          else
            # Stacks changed: plan must have run and passed. A skipped plan here means a fork PR.
            [ "$PLAN" = success ] || { echo "::error::stacks changed but Infrastructure: plan result is $PLAN (fork PRs are not planned; a maintainer must push the branch to this repo)"; exit 1; }
          fi

  plan-main:
    name: "Infrastructure: plan main"
    needs: [detect-stacks, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-stacks.outputs.stacks != '[]'
    permissions:
      contents: read
      id-token: write # OIDC -> stator-ci-plan-main
      pull-requests: write # declared by plan.yml; unused in main mode
    uses: stator-labs/stator/.github/workflows/plan.yml@main # zizmor: ignore[unpinned-uses] AWS OIDC job_workflow_ref requires @refs/heads/main
    with:
      mode: main
      stacks: ${{ needs.detect-stacks.outputs.stacks }}
      head_sha: ${{ github.sha }}

  notify:
    name: "Infrastructure: notify"
    # Runs next to apply: while apply waits for approval, this issue links the run.
    needs: [plan-main]
    if: needs.plan-main.outputs.lane == 'manual'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the "apply waiting" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.plan-main.outputs.summary }}
          ASSIGNEE: yaaf-some
        run: tools/apply-alert.sh waiting aws-apply

  apply:
    name: "Infrastructure: apply"
    needs: [plan-main]
    if: needs.plan-main.outputs.lane == 'auto' || needs.plan-main.outputs.lane == 'manual'
    permissions:
      contents: read
      id-token: write # OIDC -> stator-ci-apply
    uses: stator-labs/stator/.github/workflows/apply.yml@main # zizmor: ignore[unpinned-uses] AWS OIDC job_workflow_ref requires @refs/heads/main
    with:
      environment: ${{ needs.plan-main.outputs.lane == 'manual' && 'aws-apply' || 'aws-apply-auto' }}
      plans: ${{ needs.plan-main.outputs.plans }}
      plan_attempt: ${{ needs.plan-main.outputs.attempt }}

  report:
    name: "Infrastructure: report"
    # Always runs on main, also when nothing changed, so the issues close after a clean run.
    needs: [detect-stacks, validate, plan-main, apply]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the two rolling issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: yaaf-some
          DETECT: ${{ needs.detect-stacks.result }}
          VALIDATE: ${{ needs.validate.result }}
          PLAN: ${{ needs.plan-main.result }}
          APPLY: ${{ needs.apply.result }}
          APPLIED: ${{ needs.apply.outputs.result }}
        run: |
          echo "detect=$DETECT validate=$VALIDATE plan=$PLAN apply=$APPLY ($APPLIED)"
          # Cancelled: Supersede or a newer push took over; that run owns both issues.
          for r in "$DETECT" "$VALIDATE" "$PLAN" "$APPLY"; do
            [ "$r" != cancelled ] || { echo "cancelled: the newer run reports"; exit 0; }
          done
          if [ "$APPLIED" = superseded ]; then
            echo "superseded: the newer run reports"; exit 0
          fi
          tools/apply-alert.sh idle
          failed=""
          [ "$DETECT" != failure ] || failed="Detect stacks"
          [ "$VALIDATE" != failure ] || failed="Validate"
          [ "$PLAN" != failure ] || failed="The main plan"
          [ "$APPLY" != failure ] || failed="The apply"
          if [ -n "$failed" ]; then
            tools/apply-alert.sh failing "$failed"
          else
            tools/apply-alert.sh healthy
          fi
