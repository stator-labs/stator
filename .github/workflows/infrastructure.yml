name: Infrastructure

# PR: fmt, validate, tflint, checkov, then `tofu plan` per changed stack (stator-plan),
#     posted as one PR comment that is updated in place.
# main: `tofu plan` per stack changed since the last green main run (stator-plan-main) saves
#     each plan file. You read the plans in the run summary, approve environment aws-apply,
#     and the apply job applies exactly those files (stator-apply). No changes, no approval.
#     A failed main plan or apply keeps one GitHub issue open until a clean apply.
# Terminal-only stacks (tools/tofu-stacks.py) are never planned or applied here.

on:
  pull_request:
    branches: [main]
    # No paths filter here: "Infrastructure: required checks" is a required check and must report on every PR.
    # `detect-stacks` decides what to plan. The push trigger keeps its filter.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - "platform/infra/**"
      - "labs/*/infra/**"
      - ".github/workflows/infrastructure.yml"
      - "tools/tofu-stacks.py"
      - "tools/checkov/**"
      - ".tflint.hcl"

permissions:
  contents: read

# PRs: a new push cancels the old plan. main: one run at a time. GitHub keeps one queued
# run and cancels older queued ones, which is safe because each main run plans every stack
# changed since the last green main run, not just its own push.
concurrency:
  group: infrastructure-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  detect-stacks:
    name: "Infrastructure: detect stacks"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # main: find the last green main run
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: stacks
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ]; then
            # Diff against the last green main run, so stacks from a failed, rejected or
            # cancelled run are planned again. No green run found: plan every stack.
            BASE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow infrastructure.yml --branch main \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE=0000000000000000000000000000000000000000
            fi
            echo "base: last green main run at $BASE"
          fi
          stacks=$(python3 tools/tofu-stacks.py changed "$BASE" "$HEAD")
          echo "changed stacks: $stacks"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"

  validate:
    name: "Infrastructure: validate"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tofu, tflint, checkov (SHA256-checked)
        run: sudo tools/cloud-setup.sh tofu tflint checkov
      - name: Stack layout (backend key per stack)
        run: python3 tools/tofu-stacks.py check
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff
      - name: tofu validate
        run: |
          for dir in $(python3 tools/tofu-stacks.py all | jq -r '.[]'); do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -lockfile=readonly
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Script self-tests
        run: |
          python3 tools/plan-gate.py --self-test
          python3 tools/provider-allowlist.py --self-test
      - name: tofu test (mocked providers, no AWS access)
        # Runs every stack that has a tests/ folder. No credentials: providers are mocked.
        run: |
          for dir in $(python3 tools/tofu-stacks.py all | jq -r '.[]'); do
            [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -lockfile=readonly
            tofu -chdir="$dir" test
            echo "::endgroup::"
          done
      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
      - name: checkov (includes CKV_RUNWAY_1, required default_tags)
        run: checkov -d . --framework terraform --external-checks-dir tools/checkov --compact --quiet

  plan:
    name: "Infrastructure: plan"
    needs: [detect-stacks, validate]
    # Fork PRs get no OIDC token; the trust policy would refuse them anyway.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect-stacks.outputs.stacks != '[]'
    permissions:
      contents: read
      id-token: write # OIDC -> stator-plan
      pull-requests: write # the plan comment
    uses: stator-labs/stator/.github/workflows/tofu-plan.yml@main # zizmor: ignore[unpinned-uses] AWS OIDC job_workflow_ref requires @refs/heads/main
    # No secrets: PR plans run the PR's own code, which can read anything passed in.
    with:
      stacks: ${{ needs.detect-stacks.outputs.stacks }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      pr_number: ${{ github.event.pull_request.number }}

  required-checks:
    name: "Infrastructure: required checks"
    # Required check for auto-merge. Always runs on PRs, even when check or plan are skipped,
    # because a skipped required check would block the PR forever.
    if: always() && github.event_name != 'push'
    needs: [detect-stacks, validate, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check results
        env:
          DETECT: ${{ needs.detect-stacks.result }}
          CHECK: ${{ needs.validate.result }}
          PLAN: ${{ needs.plan.result }}
          EVENT: ${{ github.event_name }}
          STACKS: ${{ needs.detect-stacks.outputs.stacks }}
        run: |
          echo "detect=$DETECT check=$CHECK plan=$PLAN stacks=$STACKS"
          [ "$DETECT" = success ] || { echo "::error::detect did not succeed ($DETECT)"; exit 1; }
          [ "$CHECK" = success ] || { echo "::error::Infrastructure: validate did not succeed ($CHECK)"; exit 1; }
          if [ "$STACKS" = '[]' ] || [ "$EVENT" = merge_group ]; then
            # No stack changed, or the merge queue: the PR's own plan already ran, and the plan role
            # trusts pull requests only. Plan is skipped on purpose.
            [ "$PLAN" = success ] || [ "$PLAN" = skipped ] || { echo "::error::Infrastructure: plan result: $PLAN"; exit 1; }
          else
            # Stacks changed: plan must have run and passed. A skipped plan here means a fork PR.
            [ "$PLAN" = success ] || { echo "::error::stacks changed but Infrastructure: plan result is $PLAN (fork PRs are not planned; a maintainer must push the branch to this repo)"; exit 1; }
          fi

  plan-main:
    name: "Infrastructure: plan main"
    needs: [detect-stacks, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-stacks.outputs.stacks != '[]'
    permissions:
      contents: read
      id-token: write # OIDC -> stator-plan-main
      pull-requests: write # declared by the reusable workflow; unused in main mode
    uses: stator-labs/stator/.github/workflows/tofu-plan.yml@main # zizmor: ignore[unpinned-uses] AWS OIDC job_workflow_ref requires @refs/heads/main
    with:
      stacks: ${{ needs.detect-stacks.outputs.stacks }}
      head_sha: ${{ github.sha }}
      mode: main

  plan-main-alert:
    name: "Infrastructure: plan main alert"
    # plan-main has no environment, so its failure is a real failure, never a rejection.
    needs: [plan-main]
    if: failure() && needs.plan-main.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the "main is failing" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: yaaf-some
        run: tools/apply-alert.sh open 'The main plan'

  apply:
    name: "Infrastructure: apply"
    needs: [plan-main]
    if: needs.plan-main.outputs.plans != '' && needs.plan-main.outputs.plans != '{}'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: aws-apply # required reviewer; deployments from main only
    permissions:
      contents: read
      id-token: write # OIDC -> stator-apply
      issues: write # the "main is failing" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tofu
        run: sudo tools/cloud-setup.sh tofu
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: stator-apply-${{ github.run_id }}
          retry-max-attempts: 3
          mask-aws-account-id: true
      - name: Show OIDC claims (the role's trust policy must match them)
        if: failure() && steps.aws.outcome == 'failure'
        run: python3 tools/oidc-claims.py
      - name: tofu apply (the saved plans only)
        env:
          PLANS: ${{ needs.plan-main.outputs.plans }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        run: |
          set -euo pipefail
          echo "::add-mask::$AWS_ACCOUNT_ID"
          for dir in $(jq -r 'keys[]' <<<"$PLANS"); do
            echo "::group::$dir"
            key=$(jq -r --arg d "$dir" '.[$d].key' <<<"$PLANS")
            want=$(jq -r --arg d "$dir" '.[$d].sha256' <<<"$PLANS")
            tofu -chdir="$dir" init -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
            aws s3 cp --only-show-errors "s3://$TF_STATE_BUCKET/$key" "$dir/tfplan"
            got=$(sha256sum "$dir/tfplan" | cut -d' ' -f1)
            if [ "$got" != "$want" ]; then
              echo "::error::$dir: saved plan sha256 $got does not match the approved plan $want"
              exit 1
            fi
            tofu -chdir="$dir" show -json tfplan > "$RUNNER_TEMP/plan.json"
            python3 tools/plan-gate.py "$dir" "$RUNNER_TEMP/plan.json"
            # OpenTofu refuses a saved plan if the state changed since it was made.
            tofu -chdir="$dir" apply -lock-timeout=15m tfplan
            echo "::endgroup::"
          done
      - name: Close the "main is failing" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/apply-alert.sh close
      - name: Open or update the "main is failing" issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ASSIGNEE: yaaf-some
        run: tools/apply-alert.sh open 'The apply'
