name: Workflows

# Static security lint of every workflow (zizmor): unpinned actions, template injection,
# over-broad permissions, dangerous triggers. Reads the YAML; runs no workflow code.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: "Workflows: lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned zizmor (SHA256-checked)
        run: sudo tools/cloud-setup.sh zizmor
      - name: zizmor
        run: zizmor --offline .github/workflows
